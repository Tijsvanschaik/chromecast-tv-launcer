name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :apps:testDebugUnitTest :app:lintDebug :app:assembleDebug

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GLASSHOME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::GLASSHOME_KEYSTORE_BASE64 secret is missing; refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glasshome-release.jks"
      - name: Build signed release
        env:
          GLASSHOME_KEYSTORE: ${{ runner.temp }}/glasshome-release.jks
          GLASSHOME_KEYSTORE_PASSWORD: ${{ secrets.GLASSHOME_KEYSTORE_PASSWORD }}
          GLASSHOME_KEY_ALIAS: ${{ secrets.GLASSHOME_KEY_ALIAS }}
          GLASSHOME_KEY_PASSWORD: ${{ secrets.GLASSHOME_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "glasshome-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: glasshome-release
          path: glasshome-*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: glasshome-*.apk
